plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'compass'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// These integration tests use real repositories rather than Mockito instrumentation.
configurations.testRuntimeClasspath {
    exclude group: 'org.mockito'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.apache.poi:poi-ooxml:6.0.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'compass.test.postgres', providers.gradleProperty('postgresTest').isPresent()
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('test-tmp').get().asFile.absolutePath
    doFirst {
        layout.buildDirectory.dir('test-tmp').get().asFile.mkdirs()
    }
}
